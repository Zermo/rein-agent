name: ReinKlaud
options:
  bundleIdPrefix: org.zermo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(REIN_APPLE_TEAM_ID)"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  ReinKlaud:
    type: application
    platform: iOS
    sources:
      - path: ReinKlaud
    info:
      path: ReinKlaud/Info.plist
      properties:
        CFBundleDisplayName: rein-klaʊd
        CFBundleName: rein-klaʊd
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _rein-klaud._tcp
        NSLocalNetworkUsageDescription: rein-klaʊd finds and connects to a Rein gateway you choose on your local network.
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.zermo.rein-klaud.ios
        PRODUCT_NAME: ReinKlaud
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - ReinKlaudTests
  ReinKlaudTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReinKlaudTests
    dependencies:
      - target: ReinKlaud
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.zermo.rein-klaud.ios.tests
        GENERATE_INFOPLIST_FILE: YES
