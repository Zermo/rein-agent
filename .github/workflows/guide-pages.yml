name: Publish field guide

on:
  push:
    branches: [main]
    paths:
      - docs/install.html
      - docs/assets/**
      - docs/guide-deployment.md
      - scripts/build-guide-site.mjs
      - .github/workflows/guide-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: node
          package-manager-cache: false
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build public guide
        run: node scripts/build-guide-site.mjs "$RUNNER_TEMP/rein-guide-site"
      - name: Upload public guide
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/rein-guide-site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
