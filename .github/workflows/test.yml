name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  # Action helpers run on Node 24. The 'node' test entry follows the newest
  # Node.js release; numbered entries verify our existing compatibility range.
  source:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19', '24', 'node']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm test
      - run: npm run check:posthorse
      - run: npm run check:natives
      - run: npm run bundle
      - run: git diff --exit-code -- dist/rein.js dist/meat-worker.js
      - run: npm pack --dry-run
  installed-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22', '24', 'node']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node test/bundle-smoke.mjs
  obscura-browser:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', 'node']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node test/obscura-live-smoke.mjs
  meat-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'node'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: false
      - run: npm run test:meat-upstream
      - run: npm run check:meat
      - run: npm run check:natives
