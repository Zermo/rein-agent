<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Dareecho — Fresh context. Same journey.</title>
  <desc id="description">A static computer field-guide illustration on cream paper. An amber window frames square rain and a forest-green terminal: Dareecho, a glimpse into the unknown. A rust Dareecho wordmark anchors the quiet left side.</desc>
  <defs>
    <pattern id="paper" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="1" height="1" fill="#252a25" opacity="0.055"/>
      <rect x="7" y="8" width="1" height="1" fill="#252a25" opacity="0.035"/>
    </pattern>
    <pattern id="diagram-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="11" y="11" width="2" height="2" fill="#252a25" opacity="0.16"/>
    </pattern>
    <clipPath id="field">
      <rect x="1044" y="184" width="736" height="720"/>
    </clipPath>
  </defs>

  <rect width="1920" height="1080" fill="#f5eddc"/>
  <rect width="1920" height="1080" fill="url(#paper)"/>
  <rect x="40" y="40" width="1840" height="1000" fill="none" stroke="#252a25" stroke-width="5"/>

  <g fill="#252a25" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="16" font-weight="600" letter-spacing="3">
