; Dareecho — a terminal skin rebuilt from Rainmeter's skin model.
; Sections: [Rainmeter] settings, [Metadata] info, [Variables] values,
; [Measure*] data, [style*] shared meter options, [Meter*] widgets.
; ----------------------------------

[Rainmeter]
; How often the engine recomputes measures, in milliseconds.
Update=1000
; Desktop-only options the terminal rebuild accepts and ignores:
; Background=#@#Background.png

[Metadata]
; Basic information about the skin.
Name=Dareecho
Author=rein
Information=Terminal dashboard: clock, uptime, system line, and a loop gauge.
License=MIT
Version=1.0.0

[Variables]
; Variables declared here are usable between # characters (e.g. #barWidth#).
barWidth=36
gaugeWidth=12
lineWidth=24
cream=#f5eddc
rust=#b54229
amber=#ebbc5c
green=#284d3d

; ----------------------------------
; MEASURES return some kind of value
; ----------------------------------

[measureClock]
; Wall-clock time.
Measure=Time
Format=%H:%M:%S

[measureDay]
Measure=Time
Format=%A, %d %B %Y

[measureUptime]
; Engine uptime since the skin loaded.
Measure=Uptime

[measureSystem]
; Platform facts from the running Node process.
Measure=SysInfo
Property=os

[measureCores]
Measure=SysInfo
Property=cores

[measureLoop]
; A bounded counter, for the gauge and sparkline.
Measure=Loop
Start=0
End=100
Step=4
; UpdateDivider=2

; Half the loop, minus four — the calculator over other measures.
[measureHalf]
Measure=Calc
Formula=([measureLoop] / 2) - 4

; ----------------------------------
; STYLES centralize shared meter options
; ----------------------------------

[styleTitle]
W=64
StringAlign=Center
FontColor=#cream#

[styleBody]
W=64
StringAlign=Left
FontColor=#cream#

; ----------------------------------
; METERS draw values into the terminal
; ----------------------------------

[MeterTitle]
Meter=String
Text=D A R E E C H O
MeterStyle=styleTitle

[MeterClock]
Meter=String
MeasureName=measureClock
MeterStyle=styleBody

[MeterDay]
Meter=String
MeasureName=measureDay
MeterStyle=styleBody

[MeterUptime]
Meter=String
MeterStyle=styleBody
Text=UP  [measureUptime]

[MeterSystem]
Meter=String
MeterStyle=styleBody
Text=[measureSystem] / [measureCores] cores

[MeterLoopBar]
Meter=Bar
MeasureName=measureLoop
BarWidth=#barWidth#
BarColor=#rust#

[MeterLoopGauge]
Meter=Gauge
MeasureName=measureLoop
W=#gaugeWidth#
MeterColor=#amber#

[MeterLoopLine]
Meter=Line
MeasureName=measureLoop
W=#lineWidth#
Text=LOOP
LineColor=#green#

; Hidden while the loop is below 50 (Rainmeter IfActions, trimmed).
[MeterLoopFlag]
Meter=String
MeterStyle=styleBody
Text=LOOP >= 50
IfMeasureName=measureLoop
IfCondition=>=50
